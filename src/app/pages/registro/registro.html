<div class="form-container">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <h2>Capacita Web — Criar conta</h2>
    @if (mostrarErro()) {
      <h3>Não foi possível criar sua conta. Verifique os dados e tente novamente.</h3>
    }
    <mat-form-field appearance="outline">
      <mat-label>Nome completo</mat-label> <input matInput formControlName="name" />
      <mat-error>Informe seu nome completo</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label> <input matInput formControlName="email" />
      <mat-error>Você precisa escrever um endereço de e-mail válido</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label> <input matInput type="password" formControlName="password" />
      <mat-error>A senha precisa ter pelo menos 6 caracteres</mat-error>
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Criando conta...' : 'Criar conta' }}
    </button>
    <p>Já tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</div>
