<div class="form-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Simple Blog Login</h2>
    <h3 *ngIf="showError">Endereço de e-mail ou senha inválidos, por favor tente novamente!</h3>
    <mat-form-field>
      <mat-label>E-mail</mat-label>
      <input matInput name="email" formControlName="email">
      <mat-error>Você precisa escrever um endereço de e-mail válido</mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Senha</mat-label>
      <input matInput name="password" type="password" formControlName="password">
      <mat-error>Você precisa digitar uma senha</mat-error>
    </mat-form-field>
    <button mat-flat-button>Entrar</button>
  </form>
</div>
